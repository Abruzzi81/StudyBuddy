services:
  db:
    image: postgres:16
    container_name: studybuddy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: studybuddy
    ports:
      - "5434:5432"
    volumes:
      - studybuddy-pgdata:/var/lib/postgresql/data

volumes:
  studybuddy-pgdata:
